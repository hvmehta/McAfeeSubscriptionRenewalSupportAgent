<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Renewal Diagnosis Demo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
    background: #0f1115;
    color: #e6e6e6;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #9aa0a6; margin-top: 0; }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  label { color: #9aa0a6; font-size: 0.9rem; }
  select, button {
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1a1d24;
    color: #e6e6e6;
  }
  button {
    cursor: pointer;
    border-color: #3a5bd9;
    background: #24326b;
  }
  button:hover { background: #2d3f8a; }
  button:disabled { opacity: 0.5; cursor: default; }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.85rem;
    margin: 12px 0;
  }
  .badge.ok { background: #16321f; color: #6fd18a; }
  .badge.issue { background: #3a1f1f; color: #f08a6c; }
  .badge.pending { background: #2a2a2a; color: #999; }
  section { margin-top: 24px; }
  h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: #9aa0a6; margin-bottom: 8px; }
  pre {
    background: #1a1d24;
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #hints {
    background: #1a1d24;
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 14px 14px 14px 32px;
    margin: 0;
    line-height: 1.5;
  }
  #hints li + li { margin-top: 8px; }
  .explanation {
    background: #1a1d24;
    border: 1px solid #2a2d34;
    border-radius: 8px;
    padding: 14px;
    line-height: 1.5;
  }
  .error { color: #f08a6c; }
</style>
</head>
<body>
  <h1>Subscription Renewal Support Agent</h1>
  <p class="subtitle">Deterministic diagnosis over seeded evidence, with an optional LLM explanation layer.</p>

  <div class="controls">
    <label for="customerSelect">Select demo customer</label>
    <select id="customerSelect"></select>
    <button id="diagnoseBtn">Diagnose</button>
    <button id="explainBtn">Diagnose + Explain</button>
  </div>

  <div id="badge"></div>

  <section id="evidenceSection" hidden>
    <h2>Evidence</h2>
    <pre id="evidence"></pre>
  </section>

  <section id="hintsSection" hidden>
    <h2>Investigation Hints (for engineers)</h2>
    <ul id="hints"></ul>
  </section>

  <section id="explanationSection" hidden>
    <h2>Explanation (for the customer)</h2>
    <div class="explanation" id="explanation"></div>
  </section>

<script>
  const customerSelect = document.getElementById('customerSelect');
  const diagnoseBtn = document.getElementById('diagnoseBtn');
  const explainBtn = document.getElementById('explainBtn');
  const badge = document.getElementById('badge');
  const evidenceSection = document.getElementById('evidenceSection');
  const evidenceEl = document.getElementById('evidence');
  const hintsSection = document.getElementById('hintsSection');
  const hintsEl = document.getElementById('hints');
  const explanationSection = document.getElementById('explanationSection');
  const explanationEl = document.getElementById('explanation');

  function setBadge(text, cls) {
    badge.innerHTML = `<span class="badge ${cls}">${text}</span>`;
  }

  function setButtonsDisabled(disabled) {
    diagnoseBtn.disabled = disabled;
    explainBtn.disabled = disabled;
  }

  async function runDiagnose(withExplain) {
    const customerId = customerSelect.value;
    setButtonsDisabled(true);
    setBadge('Running…', 'pending');
    evidenceSection.hidden = true;
    hintsSection.hidden = true;
    explanationSection.hidden = true;

    const path = withExplain
      ? `/diagnose/${customerId}/explain`
      : `/diagnose/${customerId}`;

    try {
      const response = await fetch(path);
      const body = await response.json();

      if (!response.ok) {
        setBadge('Error', 'issue');
        explanationSection.hidden = false;
        explanationEl.innerHTML = `<span class="error">${body.detail || 'Request failed'}</span>`;
        return;
      }

      setBadge(body.diagnosis_code, body.diagnosis_code === 'OK' ? 'ok' : 'issue');
      evidenceSection.hidden = false;
      evidenceEl.textContent = JSON.stringify(body.evidence, null, 2);

      if (body.investigation_hints && body.investigation_hints.length > 0) {
        hintsSection.hidden = false;
        hintsEl.innerHTML = body.investigation_hints.map(h => `<li>${h}</li>`).join('');
      }

      if (withExplain) {
        explanationSection.hidden = false;
        explanationEl.textContent = body.explanation;
      }
    } catch (err) {
      setBadge('Error', 'issue');
      explanationSection.hidden = false;
      explanationEl.innerHTML = `<span class="error">${err}</span>`;
    } finally {
      setButtonsDisabled(false);
    }
  }

  async function loadCustomers() {
    setButtonsDisabled(true);
    try {
      const response = await fetch('/customers');
      const customers = await response.json();
      customerSelect.innerHTML = customers
        .map(c => `<option value="${c.customer_id}">${c.name} — ${c.customer_id}</option>`)
        .join('');
    } catch (err) {
      customerSelect.innerHTML = '<option value="">(failed to load customers)</option>';
    } finally {
      setButtonsDisabled(false);
    }
  }

  diagnoseBtn.addEventListener('click', () => runDiagnose(false));
  explainBtn.addEventListener('click', () => runDiagnose(true));
  loadCustomers();
</script>
</body>
</html>
